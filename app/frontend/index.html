<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFilterNet - Noise Reduction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DeepFilterNet</h1>
            <p class="subtitle">Noise Reduction for Audio Files</p>
        </header>

        <main>
            <div class="upload-section" id="upload-section">
                <div class="upload-area" id="upload-area">
                    <div class="upload-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-text">Drag and drop your WAV file here</p>
                    <p class="upload-hint">or click to browse</p>
                    <input type="file" id="file-input" accept=".wav" hidden>
                    <p class="file-info">Supported: WAV (48kHz) • Max: 100MB</p>
                </div>
            </div>

            <div class="processing-section" id="processing-section" style="display: none;">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <p class="progress-text" id="progress-text">Uploading...</p>
                    <p class="progress-percentage" id="progress-percentage">0%</p>
                </div>
            </div>

            <div class="result-section" id="result-section" style="display: none;">
                <div class="audio-players">
                    <div class="audio-box">
                        <h3>Original Audio</h3>
                        <audio id="original-audio" controls></audio>
                    </div>
                    <div class="audio-box">
                        <h3>Enhanced Audio</h3>
                        <audio id="enhanced-audio" controls></audio>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" id="download-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download Enhanced Audio
                    </button>
                    <button class="btn btn-secondary" id="new-file-btn">
                        Process Another File
                    </button>
                </div>
            </div>

            <div class="error-section" id="error-section" style="display: none;">
                <div class="error-message">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <h3>Error Processing File</h3>
                    <p id="error-text"></p>
                    <button class="btn btn-secondary" id="retry-btn">Try Again</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by <a href="https://github.com/Rikorose/DeepFilterNet" target="_blank">DeepFilterNet</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
